<text x='76' y='880' font-size='12' fill='#555'>Cualquier pin GND sirve (6, 9, 14, 20, 25, 30, 34, 39). Los GPIO sí son fijos: los define config.json.</text>
<rect x='640' y='812' width='500' height='108' rx='10' fill='#fff3f2' stroke='#d32f2f' stroke-width='2'/>
<text x='654' y='838' font-size='16' font-weight='700' fill='#b00020'>⚠ Antes de tocar los pines</text>
<text x='654' y='862' font-size='13' fill='#222'>1. Pi apagada y SIN el cable de corriente.</text>
<text x='654' y='880' font-size='13' fill='#222'>2. Nunca conectes los botones a 5V (pines 2 y 4) ni a 3V3 (1 y 17).</text>
<text x='654' y='898' font-size='13' fill='#222'>3. Si el botón arcade trae foquito de 12 V / 5 V, NO lo conectes a la Pi</text>
<text x='654' y='916' font-size='13' fill='#222'>    todavía: se hace aparte con un transistor (ver README).</text>
